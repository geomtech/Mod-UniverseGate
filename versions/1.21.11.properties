# Dependencies for Minecraft 1.21.11.
# Every key here is available as a project property in the :common/:fabric/:neoforge builds of this version.
minecraft_version=1.21.11

# Fabric: https://fabricmc.net/develop
loader_version=0.18.4
fabric_api_version=0.141.6+1.21.11
# Accepted Minecraft versions in fabric.mod.json
fabric_minecraft_dependency=~1.21.11

# NeoForge: https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.11.48
# Vanilla (NeoForm) version used to compile the loader-independent 'common' module
neo_form_version=1.21.11-20251209.172050
# Accepted Minecraft versions in neoforge.mods.toml
neoforge_minecraft_range=[1.21.11,1.21.12)
