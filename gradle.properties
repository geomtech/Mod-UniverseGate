# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Build tooling (shared by every Minecraft version).
# Minecraft, loader and Fabric API versions live in versions/<mc>.properties.
loom_version=1.15-SNAPSHOT
# check on https://projects.neoforged.net/neoforged/moddevgradle
moddev_version=2.0.141

# Stonecutter: build scripts are Groovy on purpose, silence the "use Kotlin" notice
dev.kikugie.stonecutter.hard_mode=true

# Mod Properties
mod_version=1.0.0
maven_group=fr.geomtech.universegate
archives_base_name=universegate

# Test dependencies
junit_version=5.11.4
