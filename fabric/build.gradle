plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

	// Optional energy compat (Stellaris, Tech Reborn...): compile only, never shipped nor required.
	// The compat class is only loaded when the team_reborn_energy mod is present at runtime.
	modCompileOnly "teamreborn:energy:${rootProject.team_reborn_energy_version}"
}

loom {
	runs {
		client {
			client()
			ideConfigGenerated(true)
			runDir('runs/client')
		}
		server {
			server()
			ideConfigGenerated(true)
			runDir('runs/server')
		}
	}
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}
