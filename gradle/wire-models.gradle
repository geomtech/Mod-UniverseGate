import groovy.json.JsonOutput

// Electric wires are rendered by ElectricWireRenderer as smooth 3D octagonal tubes;
// keep a minimal particle-only block model so breaking particles work with zero extra geometry.
tasks.register('generateWireModels') {
    def destination = layout.buildDirectory.dir('generated/wire-resources')
    inputs.file(rootProject.file('gradle/wire-models.gradle'))
    outputs.dir(destination)
    doLast {
        def assets = new File(destination.get().asFile, 'assets/universegate')
        assets.deleteDir()
        def writeJson = { String path, Object value ->
            def file = new File(assets, path + '.json')
            file.parentFile.mkdirs()
            file.setText(JsonOutput.toJson(value), 'UTF-8')
        }
        writeJson('models/block/wire/particle', [textures: [particle: 'universegate:block/crocodile_clip_red']])
        writeJson('blockstates/electric_wire', [variants: ['': [model: 'universegate:block/wire/particle']]])
    }
}
