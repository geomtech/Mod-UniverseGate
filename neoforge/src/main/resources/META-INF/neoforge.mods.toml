modLoader = "javafml"
loaderVersion = "[4,)"
license = "CC0-1.0"
issueTrackerURL = "https://github.com/geomtech/Mod-UniverseGate/issues"

[[mods]]
modId = "universegate"
version = "${version}"
displayName = "UniverseGate"
authors = "GeomTech"
displayURL = "https://geomtech.fr/"
logoFile = "assets/universegate/icon.png"
description = '''
UniverseGate est un mod axé portails qui te permet de construire et relier des portes entre lieux et dimensions, puis d'explorer la Rift.
'''

[[mixins]]
config = "universegate.mixins.json"

[[mixins]]
config = "universegate.client.mixins.json"

[[dependencies.universegate]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.universegate]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

# Optional: energy compatibility. UniverseGate works fully without Stellaris; when it is present,
# Stellaris cables connect to the Energy Condenser through NeoForge's energy capability.
[[dependencies.universegate]]
modId = "stellaris"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
