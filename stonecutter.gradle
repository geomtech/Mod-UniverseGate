plugins {
	id 'dev.kikugie.stonecutter'
	// Declared here (not applied) so both loader plugins share one classloader.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

// Minecraft version the sources in */src are currently written for.
// Switch with `./gradlew "Set active project to <mc>"`, and switch back to 1.21.1 before committing
// (`./gradlew "Reset active project"`).
stonecutter.active '1.21.1'

// Plain renames between Minecraft versions (Mojang mappings), applied to the sources when switching
// the active version. Anything that is more than a rename uses `//?` conditions in the code instead.
stonecutter.parameters {
	replacements.string(eval(current.version, '>=1.21.11')) {
		replace('ResourceLocation', 'Identifier')
		replace('net.minecraft.client.model.CowModel', 'net.minecraft.client.model.animal.cow.CowModel')
		replace('net.minecraft.world.entity.npc.Villager;', 'net.minecraft.world.entity.npc.villager.Villager;')
		replace('net.minecraft.world.entity.npc.VillagerProfession;', 'net.minecraft.world.entity.npc.villager.VillagerProfession;')
		replace('net.minecraft.world.entity.projectile.AbstractArrow', 'net.minecraft.world.entity.projectile.arrow.AbstractArrow')
		replace('net.minecraft.world.entity.projectile.ThrownEnderpearl', 'net.minecraft.world.entity.projectile.throwableitemprojectile.ThrownEnderpearl')
		replace('net.minecraft.world.entity.vehicle.AbstractMinecart', 'net.minecraft.world.entity.vehicle.minecart.AbstractMinecart')
		replace('MobSpawnType', 'EntitySpawnReason')
		replace('net.minecraft.world.item.UseAnim;', 'net.minecraft.world.item.ItemUseAnimation;')
		replace('UseAnim.', 'ItemUseAnimation.')
		replace('public UseAnim ', 'public ItemUseAnimation ')
		replace('.location()', '.identifier()')
		replace('getMinBuildHeight()', 'getMinY()')
		// getMaxY() is the highest block, getMaxBuildHeight() was one above it
		replace('getMaxBuildHeight()', 'getMaxY() + 1')
		replace('.isDay()', '.isBrightOutside()')
		replace('.noCollission()', '.noCollision()')
		replace('MobEffects.CONFUSION', 'MobEffects.NAUSEA')
		replace('MobEffects.MOVEMENT_SLOWDOWN', 'MobEffects.SLOWNESS')
		replace('import net.minecraft.world.entity.RelativeMovement;', 'import net.minecraft.world.entity.Relative;')
		replace('Set.<RelativeMovement>of()', 'Set.<Relative>of()')
		replace('.hasImpulse = ', '.needsSync = ')
		replace('Direction.getNearest(', 'Direction.getApproximateNearest(')
		// Client rendering
		replace('import net.minecraft.client.renderer.RenderType;', 'import net.minecraft.client.renderer.rendertype.RenderType; import net.minecraft.client.renderer.rendertype.RenderTypes;')
		replace('RenderType.lightning()', 'RenderTypes.lightning()')
		// Removed classes: version-specific stand-ins in common/versions/<mc>/src (package compat)
		replace('import net.minecraft.world.ItemInteractionResult;', 'import fr.geomtech.universegate.compat.ItemInteractionResult;')
		replace('import net.minecraft.world.InteractionResultHolder;', 'import fr.geomtech.universegate.compat.InteractionResultHolder;')
		replace('public ItemInteractionResult useItemOn(', 'public InteractionResult useItemOn(')
		replace('public InteractionResultHolder<ItemStack> use(', 'public InteractionResult use(')
		replace('import net.minecraft.world.level.block.state.properties.DirectionProperty;', 'import net.minecraft.world.level.block.state.properties.EnumProperty; // DirectionProperty')
		replace('DirectionProperty FACING', 'EnumProperty<Direction> FACING')
	}
}

// Stonecutter nodes: one project per branch and Minecraft version (:common:1.21.1, :fabric:1.21.1, ...).
apply from: rootProject.file('gradle/wire-models.gradle')
def nodes = subprojects.findAll { it.parent != rootProject }
def nodeOf = { String branch, String mc -> project(":${branch}:${mc}") }

configure(nodes) {
	// Load versions/<mc>.properties as project properties (minecraft_version, fabric_api_version, ...).
	def mc = project.name
	def versionProps = rootProject.file("versions/${mc}.properties")
	if (!versionProps.exists()) {
		throw new GradleException("Missing ${versionProps} for Minecraft ${mc}")
	}
	def props = new Properties()
	versionProps.withInputStream { props.load(it) }
	props.each { key, value -> ext.set(key as String, value) }

	apply plugin: 'java'
	apply plugin: 'maven-publish'

	if (project.parent.name == 'common') {
		sourceSets.main.resources.srcDir(rootProject.tasks.named('generateWireModels'))
	}

	version = "${rootProject.mod_version}+${mc}"
	// One group per branch: :common:1.21.1 and :fabric:1.21.1 share name and version, so with the same
	// group Gradle would see one module and `compileOnly commonProject` would resolve to the loader itself.
	group = "${rootProject.maven_group}.${project.parent.name}"

	base {
		archivesName = "${rootProject.archives_base_name}-${project.parent.name}"
	}

	repositories {
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven {
					name = 'Sponge'
					url = 'https://repo.spongepowered.org/repository/maven-public/'
				}
			}
			filter { includeGroupAndSubgroups('org.spongepowered') }
		}
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	// A resource in <branch>/versions/<mc>/src/main/resources replaces the shared one with the same
	// path: that source dir comes first and the first copy wins.
	tasks.withType(ProcessResources).configureEach {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}
	tasks.matching { it.name == 'sourcesJar' }.configureEach {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
		it.options.encoding = 'UTF-8'
	}

	jar {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${rootProject.archives_base_name}" }
		}
	}

	sourceSets {
		e2eTest {
			compileClasspath = sourceSets.main.output + compileClasspath
			runtimeClasspath = sourceSets.main.output + runtimeClasspath
		}
	}

	configurations {
		e2eTestImplementation.extendsFrom(configurations.implementation)
		e2eTestCompileOnly.extendsFrom(configurations.compileOnly)
		e2eTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
	}

	dependencies {
		e2eTestImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
		e2eTestImplementation 'org.junit.jupiter:junit-jupiter'
		e2eTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.register('e2eTest', Test) {
		group = 'verification'
		description = 'Runs isolated end-to-end and contract verification tests.'
		testClassesDirs = sourceSets.e2eTest.output.classesDirs
		classpath = sourceSets.e2eTest.runtimeClasspath
		useJUnitPlatform()
		shouldRunAfter(tasks.named('test'))
		testLogging {
			events 'passed', 'skipped', 'failed'
			exceptionFormat 'full'
		}
	}
}

// Shared wiring for the loader projects: compile the common sources of the same Minecraft version
// and ship the common resources inside each loader jar.
configure(nodes.findAll { it.parent.name in ['fabric', 'neoforge'] }) {
	def commonProject = nodeOf('common', project.name)
	evaluationDependsOn(commonProject.path)

	def commonMain = commonProject.sourceSets.main
	def commonE2eTest = commonProject.sourceSets.e2eTest
	sourceSets.e2eTest.compileClasspath += commonE2eTest.output
	sourceSets.e2eTest.runtimeClasspath += commonE2eTest.output

	dependencies {
		// Lets IDEs resolve common classes from loader code; the sources themselves are compiled below.
		compileOnly commonProject
	}

	tasks.named('compileJava', JavaCompile) {
		source(commonMain.java)
	}

	tasks.named('processResources', ProcessResources) {
		from(commonMain.resources)
	}

	tasks.named('sourcesJar', Jar) {
		from(commonMain.allSource)
	}

	publishing {
		publications {
			create('mavenJava', MavenPublication) {
				artifactId = base.archivesName.get()
				from components.java
			}
		}
	}
}

// `./gradlew buildAll` builds every loader for every Minecraft version.
// `./gradlew build` does the same (it runs in every project); `./gradlew :fabric:1.21.1:build` builds one jar.
tasks.register('buildAll') {
	group = 'build'
	description = 'Builds the Fabric and NeoForge jars for every supported Minecraft version.'
	dependsOn(nodes.collect { "${it.path}:build" })
}

tasks.register('e2eTestAll') {
	group = 'verification'
	description = 'Runs isolated E2E tests across common, fabric, and neoforge for every supported Minecraft version.'
	dependsOn(nodes.collect { "${it.path}:e2eTest" })
}
