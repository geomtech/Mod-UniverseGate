plugins {
	id 'net.neoforged.moddev' version '2.0.148'
	id 'maven-publish'
}

repositories {
	maven { url = 'https://maven.sinytra.org' }
	mavenCentral()
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	client
	gametest
}

sourceSets.client.compileClasspath += sourceSets.main.output
sourceSets.client.runtimeClasspath += sourceSets.main.output
sourceSets.gametest.compileClasspath += sourceSets.main.output + sourceSets.client.output
sourceSets.gametest.runtimeClasspath += sourceSets.main.output + sourceSets.client.output

configurations {
	clientImplementation.extendsFrom implementation
	clientCompileOnly.extendsFrom compileOnly
	gametestImplementation.extendsFrom implementation
}

dependencies {
	implementation "net.neoforged:neoforge:${project.neo_version}"
	implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_api_version}"
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			sourceSet = sourceSets.client
			programArgument '--username'
			programArgument 'Dev'
		}
		server {
			server()
		}
		gameTestServer {
			type = 'gameTestServer'
			sourceSet = sourceSets.gametest
		}
	}

	mods {
		universegate {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet sourceSets.gametest
		}
	}

	addModdingDependenciesTo sourceSets.client
	addModdingDependenciesTo sourceSets.gametest
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: inputs.properties.version,
			minecraft_version: project.minecraft_version,
			neo_version: project.neo_version
	}
}

jar {
	from sourceSets.client.output
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
